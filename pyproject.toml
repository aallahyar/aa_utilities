

[build-system]
requires      = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aa_utilities"
version = "0.0.52"
description = "General utilities that I often use during my day-to-day work"
readme = "README.md"
authors = [{ name = "Amin Allahyar", email = "amin.allahyar@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["utilities", "personal"]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
repository    = "https://github.com/aallahyar/aa_utilities.git"
documentation = "https://github.com/aallahyar/aa_utilities/blob/main/README.md"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}


[project.optional-dependencies]
# install with extras:
# pip3 install aa_utilities[extras]

extras = [
    "colorama", 
    "ipympl", # if interactive visualization is needed
    "patsy", # for expression level correction
    "joblib", # for parallelization of R calls
]

# pyproject.toml — pytest defaults (optional but recommended)
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra" # show extra test summary info for skipped, failed, etc.
markers = [
    "requires_rspace: mark test as requiring R and rpy2",
]

[tool.ruff]
# dev_scripts/ holds ad-hoc, non-packaged debugging/demo scripts; not held to the same bar.
extend-exclude = ["dev_scripts"]

[tool.ruff.lint]
# keep the classic, low-noise flake8-equivalent baseline (syntax errors, undefined names,
# unused imports/variables); broader style/security rule categories are not enabled here.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "F403"] # intentional re-exports define each subpackage's public API
"tests/**" = ["E731"] # lambda fixtures are fine in tests

[tool.setuptools.package-data]
aa_utilities = ["py.typed"]